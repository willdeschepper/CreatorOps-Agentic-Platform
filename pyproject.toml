[project]
name = "creatorops-agentic-platform"
version = "0.1.0"
description = "Local-first influencer and affiliate operations backend with deterministic agentic reconciliation"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "alembic>=1.14",
  "asyncpg>=0.30",
  "email-validator>=2.2",
  "fastapi>=0.115",
  "google-auth>=2.37",
  "google-cloud-firestore>=2.20",
  "google-cloud-pubsub>=2.27",
  "greenlet>=3.1",
  "httpx>=0.28",
  "opentelemetry-api>=1.29",
  "opentelemetry-exporter-otlp-proto-grpc>=1.29",
  "opentelemetry-instrumentation-fastapi>=0.50b0",
  "opentelemetry-instrumentation-sqlalchemy>=0.50b0",
  "opentelemetry-sdk>=1.29",
  "prometheus-client>=0.21",
  "pydantic-settings>=2.7",
  "pwdlib[argon2]>=0.2",
  "pyjwt>=2.10",
  "sqlalchemy>=2.0.36",
  "structlog>=24.4",
  "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
  "mypy>=1.14",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "respx>=0.22",
  "ruff>=0.9",
]

[project.scripts]
creatorops-api = "creatorops.main:run"
creatorops-worker = "creatorops.worker:run"
creatorops-seed = "creatorops.seed:run"
creatorops-init-emulators = "creatorops.emulators:run"
creatorops-demo = "creatorops.demo:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/creatorops", "provider_sim"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-warnings"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "provider_sim", "tests"]
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["creatorops", "provider_sim"]
exclude = ["migrations"]

[[tool.mypy.overrides]]
module = ["google.*", "opentelemetry.*", "prometheus_client.*"]
ignore_missing_imports = true
